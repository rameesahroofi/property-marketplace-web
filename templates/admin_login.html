{% extends "base.html" %}
{% block title %}Admin — Plot & Key{% endblock %}
{% block content %}

<div class="panel">
  <h2>Admin access</h2>
  <p class="sub">Demo password: <code>admin123</code></p>

</div>

{% endblock %}
